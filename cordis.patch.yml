# DMR — DeepSeek Model Route
#
# One host-plane plugin row. It registers `plan_subagent`, `impl_subagent` and
# `review_subagent`; each child's provider/model comes from `$DSH_HOME/dmr.json`
# read at call time, so editing that file changes the next delegation without
# reinstalling anything.
#
# Why the HOST plane and no preset: a preset's plugin list is composed once per
# session, and a started session cannot switch presets (`AgentPresetSeatController`
# answers `unchanged`), so a preset-scoped tool would be unavailable until the user
# opens a new session from a picker. These tools are ordinary delegation tools, not
# a composition of the main agent, so they belong where every session sees them.
#
# To scope them to one preset instead, move this row into that preset's `plugins`
# list and drop it here. That is the only change needed.
- insert:
    - id: dmr-delegation
      name: 'dsh-deepseek-model-route'
      config:
        provider: spawn
